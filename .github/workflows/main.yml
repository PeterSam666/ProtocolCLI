name: .NET Core Continuous Integration

on:
  push:
    branches: [ "master", "main", "dev" ]
  pull_request:
    branches: [ "master", "main", "dev" ]

jobs:
  build-and-test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore Test Project
      run: dotnet restore ModbusDriver.Tests/ModbusDriver.Tests.csproj

    - name: Check Code Formatting
      run: dotnet format --verify-no-changes --no-restore

    - name: Build Test Project
      run: dotnet build ModbusDriver.Tests/ModbusDriver.Tests.csproj --configuration Release --no-restore

    - name: Run Unit Tests with Coverage
      run: >
        dotnet test ModbusDriver.Tests/ModbusDriver.Tests.csproj 
        --configuration Release 
        --no-build 
        --verbosity normal
        --collect:"XPlat Code Coverage"
