name: .NET Core Continuous Integration

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # Step 1: Checkout the source code
    - name: Checkout Code
      uses: actions/checkout@v4

    # Step 2: Install .NET SDK 8.0
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    # Step 3: Restore dependencies by searching for all .csproj files directly
    - name: Restore Dependencies
      run: dotnet restore

    # Step 4: Build all projects independently (Bypassing the broken .sln file)
    - name: Build Solution
      run: dotnet build --configuration Release --no-restore

    # Step 5: Run all unit tests across the test projects
    - name: Run Unit Tests
      run: dotnet test --configuration Release --no-build --verbosity normal
